version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      # This connects the app to the mongo service defined below
      MONGODB_URI: "mongodb://mongo:27017/releasehub"
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - NODE_ENV=development
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  mongo-data:
  n8n_data:
